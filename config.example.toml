# elkbench configuration: copy to %LOCALAPPDATA%\elkbench\config.toml (or point
# ELKBENCH_CONFIG at it). Every key is optional. A tool left out is off, and the MCP tools that
# need it say so; the server has no idea of your folder layout beyond what is here.

# Named in the approval dialog and in refusals ("needs a go from ...").
person = "the person at this PC"

# When the MCP client cannot show the approval prompt (for example a remote session that declines
# it unseen): 'popup' asks on this PC; 'thread' has the session ask in the chat it reports to
# (any thread or channel) and pass the reply on with its id or link (weaker: elkbench cannot
# tell who wrote it); 'both' does both, the first answer counts.
# approval_fallback = 'popup'

# How many emulators batches (the batch tool) may run at once on this PC, across sessions.
# batch_max_emulators = 8

# Where evidence goes when a unit sets no `evidence` of its own: <root>\<unit>\runs.
# Default: Documents\elkbench.
# evidence_root = 'C:\Users\me\Documents\elkbench'

# Refuse hardware calls unless analoghealth has a local write policy installed (its
# writepolicy.py: ANALOGHEALTH_POLICY, else policy.py in %LOCALAPPDATA%\analoghealth).
# require_write_policy = false

# The built-in emulator starts (<folder>\<unit>\<start>.txt, emulator-only plans): a hardware
# plan is also gated from these. Default: starts\ in this folder, which follows the example write
# policy's names and slots (examples\write-policy); point it at your own copies for other rules.
# starts = 'C:\tests\starts'

# Keep the PC from going to sleep while a unit is claimed or queued for, or a run, an emulator or
# a go is going (Windows: SetThreadExecutionState; Linux: systemd-inhibit, if installed). The
# display may still turn off. Sleep mid-run cuts a flash or a listening test short and drops a
# remote client session.
# keep_awake = true

# Programs that open MIDI ports beside elkbench's tools: a hardware run or flash starts with a
# warning for each one running (WQL LIKE patterns on the process image name, % = any text). The
# job log also records the pid and start time of midisrv (Windows MIDI Services), and says when
# it restarted since the last hardware run.
# midi_clients = ['Transfer.exe', 'Overbridge%']

[tools]
# elklock.py; default: elklock\elklock.py in this folder.
# elklock = 'C:\tools\elklock\elklock.py'
# analoghealth checkout (tools\analogrun.py, testplan.py): plans, steps, screens.
# analoghealth = 'C:\src\analoghealth'
# digihealth tree with tools\digirun.py: steps and screens on the Digitone (and Digitakt).
# digihealth = 'C:\src\digihealth'
# analog-emu's binaries (rytm.exe, a4.exe): the emulator tool starts them headless.
# analog_emu = 'C:\src\analog-emu\target\release'
# digiemu checkout with USB MIDI (tools/usbrun.py): the Digitone and Digitakt emulators. Builds are set up
# once in ~/.local/state/elkbench/digiemu (inside WSL when run there); without a build,
# `flash target emulator` runs its emu.fwcheck.
# digiemu = 'C:\src\digiemu'
# Its Python (digiemu needs its patched unicorn); a first item 'wsl' runs it in WSL.
# digiemu_python = ['wsl', '~/venvs/digiemu/bin/python']
# A +Drive sample-store tool (samplegate.py: ls, rm, rmdir PATH, --port P, exit 3 when the write
# policy refuses) for the Rytm: release removes the ~T folders a go named in drive_items with it.
# samplegate = 'C:\tools\samplegate.py'
# A +Drive /mods tool (modsgate.py: ls [FOLDER], rm NAME, --port P, exit 3 when the write policy
# refuses) for the Rytm: release removes the ~T folders and files below /mods a go named in
# drive_items with it, deepest first; modsgate_elekloader is the elekloader tree it runs (for
# folders: drive-loader e37adef or later).
# modsgate = 'C:\tools\modsgate.py'
# modsgate_elekloader = 'C:\src\elekloader'
# elkflash checkout to run `python -m elkflash` in; leave out if elkflash is pip-installed.
# elkflash = 'C:\src\elkflash'
# The audio scripts (asio_rec.py, asio_tone.py, audiocheck.py: audio_record, audio_check) are
# bundled in audio\ here; set this only to use another copy.
# usb_audio = 'C:\src\elkbench\audio'
# A Python with numpy and scipy for the audio scripts; default: the one running elkbench.
# audio_python = ['C:\Python312\python.exe']
# Overbridge Total Recall (recall_take, recall_restore) is built in: obtr.py in this folder.

# elklock reads this file too: tools.elkflash and tools.analoghealth for its handoff snapshot.
# Emulator headroom (off unless this table is here): every emulator start (the emulator tool and
# each batch run) waits until the PC has room: whole-PC CPU under max_cpu percent (a few seconds'
# average), min_free_gb of RAM free, and fewer than max_emulators emulator processes running
# (anyone's, by image name). The emulator tool waits up to start_wait_secs, then refuses; batch
# runs wait as long as it takes. `python headroom.py --wait 600` makes the same check for a sweep
# run outside elkbench. A busy analog-emu takes about one core. The values shown are the defaults.
# [emulator_headroom]
# max_cpu = 60
# min_free_gb = 4
# max_emulators = 10
# start_wait_secs = 120
# images = ['rytm.exe', 'a4.exe', 'vskip.exe', 'dtboot.exe', 'dtpeek.exe']

# [elklock]
# More command names its Bash hook treats as device tools, beside the built-in analogusb,
# analogrun, digiusb, digirun, elkflash and obtr (for example your own scripts).
# guard = ['my_record_script']

# Per unit (rytm, a4, digitone, digitakt): any built-in fact (port, emu, asio, engine) can be
# overridden too.
# [emulator]                               # timing for analog-emu runs (docs/emulator-timing.md); unset:
#                                          # as before (DTEMU_TIMING from the daemon's environment)
# timing = 'unit'                          # off, unit (sampled, about real time) or exact (about 0.6x)
# stream = true                            # Rytm: the Sidecar's Overbridge stream (--usb-overbridge)
# stream_at = 9                            # s of emulated time at which USB CONFIG becomes OVERBRIDGE
# cpu_gate = true                          # run_plan reads analoghealth stats after boot settles:
# cpu_warn = 90                            #   passes with a margin risk above this CPU %
# cpu_fail = 95                            #   fails at this CPU % or more, and when nothing is read
# cpu_settle = 90                          #   readings from this second of uptime on
# cpu_readings = 4                         #   readings it takes itself after the plan,
# cpu_gap = 5                              #   this many s apart,
# cpu_quiet = 10                           #   after this many s with nothing sent

# [units.rytm]
# evidence = 'C:\tests\rytm\runs'          # run folders and test-log.md
# refs = 'C:\tests\rytm\refs'              # default folder for expect_screen references
# stock = ['C:\os\Analog-Rytm_MKII_OS1.74.syx']   # what counts as "stock" at release
# rest = ['C:\tests\base\BASE1.syx']      # other OSes release accepts the unit being left on
#                                          # (a base build for Drive Loader tests); empty: stock only
# clear_at_release = '121-128'           # project slots release backs up, erases and lists empty, so
#                                        # every run finds them so (Rytm, A4 and Digitone; the example
#                                        # policy's test slots); the go request names it
# no_stats = ['C:\os\remote-only.syx']     # builds whose runner channel has no stats command:
#                                          # plans and steps with a stats step are refused on them
# emu_card = 'C:\tests\rytm\card.img'      # the emulator tool boots a fresh copy of it
# emu_usb_midi_real = true                # its emulators run the firmware's own USB MIDI sender
#                                        # (analog-emu --usb-midi-real), so mods that check the
#                                        # sender first (sidecar-check record reads) answer
# emu_cv_in = "1=A"                     # A4: its emulators see CV OUT A patched into CONTROL IN 1
#                                        # (analog-emu --cv-in; "2=2500" holds CONTROL IN 2 at 2.5 V)
# port = 'Sidecar | Expander (Pi)'         # its MIDI port on hardware (a part of the name; default the
#                                          # built-in 'Analog Rytm', direct USB): only for a unit always
#                                          # behind a MIDI host; for single runs through one, set
#                                          # ELKBENCH_RYTM_PORT (_A4_, ...) for the daemon instead, which
#                                          # overrides it. Flashes, steps, data, plans, the connected
#                                          # check and the release's slot clear and snapshot use it;
#                                          # elklock reads it too (and has release --port)
# din = 'USB MIDI Interface'               # older form, still read: counts as one [din.NAME] entry
#                                          # below (one per port, however many units list it). Which
#                                          # unit an interface reaches is not set here any more.
#                                          # Digitone: give a DIN capture about 8 s (its DIN
#                                          # reply comes later than over USB)

# DIN MIDI interfaces: one section per interface, not per unit. A cable can be moved from unit to
# unit with no change here: before a hardware run's first din step (send/capture/cc/... din),
# elkbench sends analoghealth's read-only probe (tools/dinprobe.py: Elektron RPC Ping, then the
# MIDI Identity Request) out of each connected interface and uses the one where the claimed unit
# answers; none answering as that unit refuses the steps. Each interface is an elklock device of
# its own (din-NAME), claimed with the unit by the run that uses it and released with the unit.
# Cable both ways: the interface's OUT to the unit's MIDI IN, its IN from the unit's MIDI OUT.
# [din.u2midi]
# port = 'U2MIDI Pro'                       # a part of its MIDI port name, or 'IN,OUT'
# [din.second]                              # a second interface: add its port once
# port = 'USB MIDI Interface'
